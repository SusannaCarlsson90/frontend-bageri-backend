<div class="auth-container">
  <h2 class="auth-title">Logga in</h2>

  <form (ngSubmit)="login()" class="auth-form">
    @if (message()) {
      <div class="alert">
        {{ message() }}
      </div>
    }

    <div class="form-group">
      <label for="username">Användarnamn</label>
      <input type="text" id="username" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" required>
    </div>

    <div class="form-group">
      <label for="password">Lösenord</label>
      <input type="password" id="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" required>
    </div>

    <button type="submit" class="btn-auth">Logga in</button>
  </form>
</div>
