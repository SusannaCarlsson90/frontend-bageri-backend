<div class="auth-container">
  <h2 class="auth-title">Registrera konto</h2>

  <form (ngSubmit)="register()" class="auth-form">
    @if (message()) {
      <div class="alert">
        {{ message() }}
      </div>
    }

    <div class="form-group">
      <label for="username">Användarnamn</label>
      <input type="text" id="username" name="username" [(ngModel)]="username">
    </div>

    <div class="form-group">
      <label for="password">Lösenord</label>
      <input type="password" id="password" name="password" [(ngModel)]="password">
    </div>

    <button type="submit" class="btn-auth">Registrera konto</button>
  </form>
</div>
